<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marketing Funnel Animation</title>

<style>
body{
margin:0;
background:#0e0e11;
font-family:Arial;
color:white;
overflow:hidden;
}

.container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:500px;
}

.stage{
position:relative;
margin:auto;
text-align:center;
padding:18px;
margin-top:6px;
font-weight:bold;
opacity:0;
transform:translateY(-40px) scale(.9);
transition:all .8s;
}

.stage.active{
opacity:1;
transform:translateY(0) scale(1);
box-shadow:0 0 25px rgba(255,255,255,.3);
}

.tofu{width:420px;background:#ff5c5c;}
.mofu{width:320px;background:#ff9f43;}
.bofu{width:230px;background:#1dd1a1;}
.buy{width:160px;background:#54a0ff;}
.loyal{width:120px;background:#8e44ad;}

.text{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
width:70%;
text-align:center;
font-size:22px;
opacity:0;
transition:opacity 1s;
}

.text.show{
opacity:1;
}

</style>
</head>

<body>

<div class="container">

<div class="stage tofu">TOFU – Awareness</div>
<div class="stage mofu">MOFU – Consideration</div>
<div class="stage bofu">BOFU – Conversion</div>
<div class="stage buy">Purchase</div>
<div class="stage loyal">Retention</div>

</div>

<div class="text" id="desc"></div>

<script>

const stages=document.querySelectorAll(".stage");
const text=document.getElementById("desc");

const content=[
"مرحلة الوعي: جذب انتباه الغرباء بمحتوى مفيد.",
"مرحلة الاهتمام: العميل يقارن ويبحث عن الحل.",
"مرحلة القرار: عرض لا يمكن رفضه.",
"إتمام الشراء: العميل يتحول لمشتري.",
"الولاء: العميل السعيد يعود ويشتري مرة أخرى."
];

let i=0;

function animate(){

if(i<stages.length){

stages[i].classList.add("active");

text.classList.remove("show");

setTimeout(()=>{
text.innerText=content[i];
text.classList.add("show");
},400);

i++;

setTimeout(animate,2500);

}

}

animate();

</script>

</body>
</html>
